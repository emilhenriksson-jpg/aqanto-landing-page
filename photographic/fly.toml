app = "photographic"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  PUBLIC_URL = "https://photographic.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  # Claude and ChatGPT hold MCP connections open, so a short idle timeout drops
  # sessions mid-conversation.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/ready"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
