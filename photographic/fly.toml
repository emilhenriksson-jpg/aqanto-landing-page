# Photographic MCP + REST API on one origin.
# MCP endpoint: https://<app>.fly.dev/mcp
#
# Do not attach Postgres and set DATABASE_URL until @photographic/db implements
# the ports — the process currently exits when DATABASE_URL is present.

app = "photographic"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  PUBLIC_URL = "https://photographic.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Keep one warm: Claude/ChatGPT open long-lived MCP sessions.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
