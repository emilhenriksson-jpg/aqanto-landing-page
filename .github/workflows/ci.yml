name: CI

# Photographic had no CI. Every regression so far was caught by a person noticing, or
# not at all: a test double that authenticated any member of a shared room as any other
# member reached the live deploy and stayed there, because "green" was something an agent
# reported in a document rather than something a machine checked.
#
# So this file runs on every pull request and every push to `main`, and it is split into
# jobs that fail independently — the point is to say precisely what broke, not to say
# "the build is red".
#
# The workspace is `photographic/` inside this repository, not the repository root. Every
# job sets `working-directory` accordingly, and `.github/actions/setup` points
# `pnpm/action-setup` at `photographic/package.json` so the declared pnpm version is the
# one that installs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded run is wasted minutes and a confusing red mark on an old commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: photographic

env:
  # Matches `DEFAULT_DATABASE_URL` in `packages/db/src/pool.ts` and the URL the suites
  # fall back to, so nothing has to be parameterised in the test code for CI.
  DATABASE_URL: postgres://photographic:photographic@127.0.0.1:5432/photographic

jobs:
  # No `pnpm install`: this reads the import graph off disk, so it answers in seconds and
  # answers even when the lockfile is broken. It is also the only check here that would
  # have caught the bug that motivated this file.
  guards:
    name: guards (test doubles in production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/check-test-doubles.mjs
      # Three branches landed on `0016` in one afternoon and a fourth renumbered to
      # `0018`/`0019`. The migration runner sorts by filename and keys its ledger on the
      # filename, so a shared number applies in alphabetical order, and renaming a
      # migration to fix its number makes it run again on every database that already had
      # it — which is why a collision has to be caught before the merge, not after.
      - run: node scripts/check-migrations.mjs
      # `scripts/break-glass-signin.ts` had never been typechecked, because `pnpm -r run
      # typecheck` is per workspace package and `scripts/` is not one. That is fixed; this
      # is about the pattern, so the next directory outside the packages cannot go quiet
      # the same way.
      - run: node scripts/check-typecheck-coverage.mjs
      # Invite expiry and trash purging had handlers registered in both composition roots
      # with no producer anywhere, so neither had ever run once — and a registration reads
      # exactly like a finished feature, which is how both passed two reviews. Nobody
      # scans for the absence of a caller; this does.
      - run: node scripts/check-job-producers.mjs

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      # Type-aware ESLint over all 23 packages, ~13s. See `eslint.config.js` for which
      # rules are on and why. It fails on a new violation and it also fails on a
      # suppression that no longer matches anything, so the list in
      # `eslint-suppressions.json` can only shrink — `pnpm lint:prune` is the fix.
      - run: pnpm lint

  # Everything that needs no database: 19 packages including `apps/web`,
  # `apps/onboarding` and `apps/mcp`, plus the acceptance suite on the in-memory
  # reference implementation. These are the suites that a laptop with no Postgres never
  # reached, because the old root `test` script aborted at `packages/db` before them.
  unit:
    name: unit (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit
      - run: pnpm test:e2e:memory
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-report-unit
          path: photographic/test-counts/*.json
          if-no-files-found: error

  # The suites that only mean something against real SQL.
  #
  # `db`  — `packages/db` (schema, repositories, triggers), which needs the owner role
  #         because its suites `reset()` the schema between files.
  # `rest`— `apps/rest` connected as `photographic_app`, the least-privilege role
  #         production uses. Its suite does no DDL, so it is the one that can run in the
  #         production configuration rather than as the owner — which means a missing
  #         grant now fails here instead of on the live host, on one query, at whatever
  #         hour someone first uses that feature.
  # `e2e` — the acceptance suite with `HARNESS=postgres`, which is where the transaction
  #         boundaries, the append-only trigger, the placement triggers, the unique
  #         constraints and the hybrid search query are exercised. Without it the green
  #         run is the one that tests the in-memory twin of the domain rules instead of
  #         the rules themselves.
  postgres:
    name: postgres (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [db, rest, e2e]
    services:
      postgres:
        # `pgvector/pgvector:pg16`, not `postgres:16`. `0001_init.sql` creates the
        # `vector` extension; plain Postgres does not have it and the first migration
        # fails. The other four extensions the schema needs — pgcrypto, pg_trgm, citext,
        # unaccent — are contrib and ship in both.
        #
        # Nothing here is Supabase-specific: no pgsodium, no pg_cron, no `auth.` schema,
        # no RLS (the policies in `0001` were dropped in `0003`). The two suites that do
        # need a live Supabase project are already gated behind `LIVE_SUPABASE=1` and
        # stay skipped, which is the right answer rather than faking a credential.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: photographic
          POSTGRES_PASSWORD: photographic
          POSTGRES_DB: photographic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photographic -d photographic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Fails with a sentence a person can act on if the image is ever swapped for one
      # without pgvector, instead of leaving that to be read out of a migration error.
      - name: Check the database has what the schema needs
        env:
          PGPASSWORD: photographic
        run: |
          psql -h 127.0.0.1 -U photographic -d photographic -tAc "select version()"
          for ext in vector pgcrypto pg_trgm citext unaccent; do
            have=$(psql -h 127.0.0.1 -U photographic -d photographic -tAc \
              "select count(*) from pg_available_extensions where name = '$ext'")
            if [ "$have" != "1" ]; then
              echo "::error::Tillägget '$ext' finns inte i den här Postgres-avbildningen." \
                   "Schemat kräver det (packages/db/migrations). Byt tillbaka till pgvector/pgvector:pg16."
              exit 1
            fi
          done

      # Production connects as `photographic_app` — DML, no DDL — so that an injection or
      # a mistake in application code cannot reach `DROP TABLE app.event` or disable the
      # triggers that hold the append-only rules. The role existed in neither CI nor local
      # development, so nothing in the pipeline could tell whether a database object was
      # reachable from it.
      #
      # The migrations create it now. `0020_app_role_and_grants.sql` creates the role and
      # grants unguarded, superseding `0016`, which was wrapped in an `IF EXISTS` on the
      # role and therefore did nothing on a database where the role did not exist yet —
      # and was then recorded as applied, so it could never run again. Production reached
      # exactly that state.
      #
      # So this deliberately does *not* create the role by hand any more. Letting the
      # migration do it is what makes CI a test of the production fix rather than a
      # rehearsal of it. What is left is the one step that genuinely belongs to an
      # operator, and the one `0020` refuses to do because a password does not belong in a
      # file in the repository: setting the credential. Same sequence as
      # `scripts/deploy.md`, with a throwaway value.
      - name: Migrate, then set the role's password the way deploy.md does
        env:
          PGPASSWORD: photographic
        run: |
          pnpm db:migrate
          psql -h 127.0.0.1 -U photographic -d photographic -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE photographic_app PASSWORD 'photographic_app'"

      # `reset()` refuses a database nobody marked as disposable, because four suites in
      # `packages/db` drop the whole `app` schema and a developer who points them at the
      # database they were working in loses it without a prompt. This container is thrown
      # away either way, so marking it is how CI says that out loud rather than being
      # exempt from the rule.
      - run: pnpm db:mark-test

      # The apply-in-order-from-empty property, asserted where it is actually provable.
      #
      # This container was created seconds ago, so nothing in it has been renamed and
      # `applied_at` genuinely rises with the filename. That is not true on a laptop:
      # `migrate.ts` recognises a renamed migration by content and moves the ledger row to
      # the new name while keeping its original timestamp, which is correct and which means
      # a renumbered migration has a timestamp that does not match its new position. Four
      # branches renumbered in one afternoon, so that is the normal case. The runner's own
      # preflight therefore checks everything except the ordering, and `--from-empty` lives
      # only here.
      - name: The migrations apply in order from nothing
        if: matrix.suite == 'db'
        run: |
          pnpm db:migrate
          pnpm exec node --import tsx scripts/check-migration-ledger.ts --from-empty

      - run: pnpm test:${{ matrix.suite }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-report-postgres-${{ matrix.suite }}
          path: photographic/test-counts/*.json
          if-no-files-found: error

  # Builds the image the deploy actually runs, and boots it against the same Postgres.
  #
  # Two failures this repository has already had are only visible here. The `deps` stage
  # once listed workspace manifests by hand and fell four packages behind, and pnpm does
  # not fail on a missing workspace manifest — it creates the symlink and skips that
  # package's dependencies, so the image built cleanly and died at startup with `Cannot
  # find package '@photographic/core'`. And corepack resolves pnpm from the nearest
  # `packageManager` field, so a stage that copies only the lockfile installs the newest
  # pnpm instead of the declared one. Both are build-time, and nothing built.
  #
  # Not on every pull request: the build runs `pnpm fetch`, an install and three tsc/vite
  # builds, which is minutes rather than the seconds the rest of this file costs. On
  # `main` always, and on a pull request when it touches something the image is made of.
  image:
    name: image (build and boot)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes]
    if: needs.changes.outputs.image == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: photographic
          POSTGRES_PASSWORD: photographic
          POSTGRES_DB: photographic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photographic -d photographic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: photographic
          file: photographic/Dockerfile
          load: true
          tags: photographic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The trap named in the Dockerfile, asserted rather than commented. A stage that
      # installs the wrong pnpm produces a working-looking image, so the version has to
      # be read out of the thing that was built.
      - name: The image has the declared pnpm
        run: |
          declared=$(node -e "process.stdout.write(require('./package.json').packageManager.split('@')[1])")
          actual=$(docker run --rm photographic:ci pnpm --version)
          echo "declared $declared / image $actual"
          if [ "$declared" != "$actual" ]; then
            echo "::error::Avbildningen har pnpm $actual, package.json deklarerar $declared." \
                 "Ett steg i Dockerfile installerar fel version."
            exit 1
          fi

      # `--network host` so the container reaches the service container through the
      # port the runner mapped; inside its own network namespace 127.0.0.1 would be
      # itself. This is the first thing in this repository's history that runs the
      # image's CMD, migrations and all, rather than assuming it works.
      #
      # The image sets `NODE_ENV=production`, and since PR #14 a production boot refuses
      # to start without `SESSION_SECRET` and `CODE_SECRET` rather than signing sessions
      # with a value that is re-randomised on every restart. That is the right behaviour
      # and this step found it the hard way, so the values are passed here — throwaway
      # ones, because nothing in this job issues a credential anyone keeps. It is also a
      # reminder that `scripts/deploy.md` has to set both, or the documented deploy path
      # produces a container that exits on boot.
      - name: Boot it against Postgres and serve /health
        run: |
          docker run -d --name photographic-ci --network host \
            -e PORT=8080 \
            -e SESSION_SECRET=ci-throwaway-session-secret \
            -e CODE_SECRET=ci-throwaway-code-secret \
            -e DATABASE_URL=postgres://photographic:photographic@127.0.0.1:5432/photographic \
            photographic:ci

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json 2>/dev/null; then
              echo "svarade efter ${i}s: $(cat /tmp/health.json)"
              grep -q '"ok":true' /tmp/health.json || {
                echo "::error::/health svarade men inte med ok:true."; exit 1; }
              docker logs photographic-ci 2>&1 | tail -30
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=photographic-ci)" ]; then
              echo "::error::Containern dog innan den svarade. Loggen:"
              docker logs photographic-ci 2>&1 | tail -60
              exit 1
            fi
            sleep 1
          done

          echo "::error::/health svarade inte inom 45s."
          docker logs photographic-ci 2>&1 | tail -60
          exit 1

      # The other half of the boot guarantee, and the half only a negative test can hold.
      #
      # `CMD` used to separate the migration from the server with `;` rather than `&&`, so
      # a failed migration was logged and the server started anyway against a partial
      # schema. The symptom was individual 500s on whichever routes touched the new
      # column — not a crash loop anyone would investigate — and with `/health` answering
      # unconditionally, Fly called the deploy healthy. It is fixed now (`set -e` plus an
      # explicit refusal), and a fix without a test is a fix that comes back: the `;` is
      # one character and the next person to edit that line has no way to know.
      #
      # Four assertions, because "the container exited" on its own would also be satisfied
      # by exiting for an unrelated reason, and a test that passes for the wrong reason is
      # what this workflow exists to prevent.
      - name: It refuses to serve against a failed migration
        run: |
          set +e
          timeout 120 docker run --rm \
            -e PORT=8080 \
            -e SESSION_SECRET=ci-throwaway-session-secret \
            -e CODE_SECRET=ci-throwaway-code-secret \
            -e DATABASE_URL=postgres://nobody:nobody@127.0.0.1:1/nothing \
            photographic:ci > /tmp/nodb.log 2>&1
          code=$?
          set -e
          echo "--- container exited $code, log follows"
          tail -25 /tmp/nodb.log

          if [ "$code" = "124" ]; then
            echo "::error::Containern levde i 120s med en misslyckad migrering. Det är" \
                 "precis felet: servern kör mot ett halvt schema. Kontrollera att CMD i" \
                 "Dockerfile fortfarande avbryter på migreringsfel."
            exit 1
          fi
          if [ "$code" = "0" ]; then
            echo "::error::Containern startade och avslutade rent trots att migreringen" \
                 "misslyckades. CMD måste vägra starta servern när db:migrate faller."
            exit 1
          fi
          if grep -q '"msg":"listening"' /tmp/nodb.log; then
            echo "::error::HTTP-servern började lyssna trots en misslyckad migrering." \
                 "Det är semikolon-felet tillbaka, oavsett vad slutkoden blev."
            exit 1
          fi
          if ! grep -q 'ECONNREFUSED' /tmp/nodb.log; then
            echo "::error::Containern dog, men inte av databasen — ingen ECONNREFUSED i" \
                 "loggen. Testet skulle ha bevisat migreringsspärren och bevisade något" \
                 "annat, så det bevisade ingenting. Läs loggen ovan."
            exit 1
          fi
          echo "Vägrade starta, av rätt skäl."

      - name: Stop it
        if: always()
        run: docker rm -f photographic-ci || true

  # Which jobs the changed files justify. `git diff` against the merge base rather than a
  # `paths:` filter on the workflow, because a `paths:`-filtered job reports as *skipped*
  # and a skipped required check is indistinguishable from a passing one.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: building the image"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD -- \
            photographic/Dockerfile \
            photographic/.dockerignore \
            photographic/pnpm-lock.yaml \
            photographic/package.json \
            .github/workflows/ci.yml \
            .github/actions/setup/action.yml)
          echo "$changed"
          if [ -n "$changed" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  # One check to require on the branch, so adding a job below does not mean editing a
  # branch-protection rule — and so a job that was skipped or cancelled cannot be
  # mistaken for a job that passed.
  #
  # It also collects what every suite counted. A green exit code is not enough on its
  # own: when `journey.test.ts` cannot build its harness, vitest reports `3 failed` files
  # and `62 skipped` tests, so the number a person reads is one word away from the number
  # a healthy run prints. `ci-suite-summary.mjs` fails on a missing report, a group whose
  # passing count fell through its floor, or a new skip.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [guards, typecheck, unit, postgres, changes, image]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/download-artifact@v8
        with:
          pattern: suite-report-*
          merge-multiple: true
          path: photographic/test-counts

      - name: Test counts per group
        run: node scripts/ci-suite-summary.mjs test-counts

      - name: Check the other jobs
        if: always()
        working-directory: .
        run: |
          echo "guards    ${{ needs.guards.result }}"
          echo "typecheck ${{ needs.typecheck.result }}"
          echo "unit      ${{ needs.unit.result }}"
          echo "postgres  ${{ needs.postgres.result }}"
          echo "changes   ${{ needs.changes.result }}"
          echo "image     ${{ needs.image.result }} (skipped is allowed: it is conditional)"
          test "${{ needs.guards.result }}" = success \
            && test "${{ needs.typecheck.result }}" = success \
            && test "${{ needs.unit.result }}" = success \
            && test "${{ needs.postgres.result }}" = success \
            && test "${{ needs.changes.result }}" = success \
            && { test "${{ needs.image.result }}" = success \
                 || test "${{ needs.image.result }}" = skipped; }
