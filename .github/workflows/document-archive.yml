# The off-site copy of the document originals.
#
# Why this runs here rather than on the Fly machine, which is where every other background
# job in this system runs: a backup must not depend on the health of the thing it protects.
# The Fly machine is one machine with no volume, it is replaced on every deploy, and it is
# exactly what a bad afternoon takes out. A scheduled workflow runs on GitHub's runners,
# reads Supabase over the network and writes to a bucket at a third provider — so no single
# account, project or machine holds both the memory and its copy.
#
# The failure mode this is built against is not "the copy is wrong" but "nobody noticed it
# stopped". Three independent things have to be true for that to stay visible:
#
#   1. GitHub emails the repository owner when a scheduled workflow fails. That is the
#      default and it is the reason `continue-on-error` appears nowhere in this file.
#   2. The job pings BACKUP_HEARTBEAT_URL only on a clean run, so a dead-man's switch fires
#      whether the job failed or never started at all.
#   3. The running API checks the archive's manifest age itself (`document_backup` in
#      @photographic/ops) and alerts when it stops moving. That one survives this workflow
#      being disabled, which a monitor living inside the workflow would not.
#
# Secrets, set under Settings → Secrets and variables → Actions:
#   DATABASE_URL                        the session-mode pooler string (port 5432, IPv4 —
#                                       the direct connection is IPv6-only and GitHub's
#                                       runners have no IPv6)
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY     where the originals are read from
#   DOCUMENT_ARCHIVE_S3_BASE_URL        bucket endpoint at the *other* provider (R2, B2, S3)
#   DOCUMENT_ARCHIVE_S3_ACCESS_KEY_ID, DOCUMENT_ARCHIVE_S3_SECRET_ACCESS_KEY
#   BACKUP_HEARTBEAT_URL                optional; a check-in URL
#
# The archive credentials should be scoped to that one bucket, and ideally write-only. This
# job never needs to delete an object, and a credential that cannot delete is a credential
# that cannot be used to erase the backup along with the original.

name: Dokumentarkiv

on:
  schedule:
    # 02:40 UTC daily: incremental copy of anything new.
    - cron: '40 2 * * *'
    # 03:20 UTC on Sundays: the same, plus re-fetch and re-hash every object already there.
    # Bit rot and a silently truncated upload are not detectable any other way.
    - cron: '20 3 * * 0'
  workflow_dispatch:
    inputs:
      verify:
        description: 'Hämta och hasha om hela arkivet (långsammare)'
        type: boolean
        default: false
      dry_run:
        description: 'Visa vad som skulle kopieras, skriv inget'
        type: boolean
        default: false

concurrency:
  # Two overlapping runs would each copy what the other is copying. Never cancel one in
  # flight: a half-finished backup that was cancelled is the state this whole file exists to
  # avoid, and the incremental pass makes a queued run cheap.
  group: document-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Kopiera dokumenten
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The workspace is `photographic/` inside this repository, not the repository root,
    # and `working-directory` is resolved from the root no matter where this file lives.
    # This file used to sit at `photographic/.github/workflows/`, which GitHub does not
    # read at all — it only registers workflows under the root `.github/workflows/`. So it
    # had never run once: no schedule, no executions, and nothing red to notice, because a
    # workflow that was never registered produces no failures either. A dead man's switch
    # nobody wound. Moving it here is what makes the schedule real; this default is what
    # makes it work once it fires.
    defaults:
      run:
        working-directory: photographic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Kopiera originalen till arkivet
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DOCUMENT_ARCHIVE_S3_BASE_URL: ${{ secrets.DOCUMENT_ARCHIVE_S3_BASE_URL }}
          DOCUMENT_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.DOCUMENT_ARCHIVE_S3_ACCESS_KEY_ID }}
          DOCUMENT_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.DOCUMENT_ARCHIVE_S3_SECRET_ACCESS_KEY }}
          DOCUMENT_ARCHIVE_S3_REGION: ${{ vars.DOCUMENT_ARCHIVE_S3_REGION || 'auto' }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          set -euo pipefail
          flags=""
          # The weekly schedule is the one that re-hashes everything; a manual run can ask.
          if [ "${{ github.event.schedule }}" = "20 3 * * 0" ] || [ "${{ inputs.verify }}" = "true" ]; then
            flags="$flags --verify"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            flags="$flags --dry-run"
          fi
          echo "flags:$flags"
          pnpm --filter @photographic/ops backup-documents -- $flags
